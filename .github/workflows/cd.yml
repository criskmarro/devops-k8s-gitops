name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name devops-k8s-gitops-dev

      - name: Update image tag in K8s manifests
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
        run: |
          sed -i "s|ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/devops-k8s-gitops:latest|$ECR_REGISTRY/devops-k8s-gitops:$IMAGE_TAG|g" \
            k8s/base/deployment.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/base/deployment.yaml
          git commit -m "chore: update image to $IMAGE_TAG [skip ci]"
          git push

      - name: Sync Argo CD
        run: |
          echo "Argo CD detecta el cambio en el repo y sincroniza automáticamente."
          echo "Si necesitas forzar sync: argocd app sync devops-k8s-gitops"
