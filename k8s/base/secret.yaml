# IMPORTANTE: Este archivo es solo referencia de la estructura del secret.
# Nunca subas valores reales a Git.
# Para crear el secret real corre:
#
# kubectl create secret generic app-secrets -n app \
#   --from-literal=database-url="postgresql://postgres:TU_PASSWORD@postgres:5432/appdb" \
#   --from-literal=db-password="TU_PASSWORD"
#
# O usa Sealed Secrets / AWS Secrets Manager en producción.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: app
type: Opaque
# data:  <-- valores en base64, no commitear
#   database-url: <base64>
#   db-password: <base64>
